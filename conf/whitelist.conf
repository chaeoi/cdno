[General]
bypass-system = true
skip-proxy = 192.168.0.0/16, localhost, *.local, captive.apple.com
tun-excluded-routes = 192.168.0.0/16, 255.255.255.255/32
dns-server = https://doh.pub/dns-query, h3://dns.alidns.com/dns-query
fallback-dns-server = 119.29.29.29, 223.5.5.5
ipv6 = true
prefer-ipv6 = false
dns-direct-system = false
icmp-auto-reply = true
always-reject-url-rewrite = false
private-ip-answer = true
dns-direct-fallback-proxy = false
udp-policy-not-supported-behaviour = REJECT
use-local-host-item-for-proxy = false
update-url = https://cdno.canghai.org/conf/whitelist.conf

[Rule]
DOMAIN-SUFFIX,nianticlabs.com,DIRECT
DOMAIN-SUFFIX,canghai.eu.org,DIRECT
DOMAIN-SUFFIX,scdn.co,DIRECT
DOMAIN-SUFFIX,spotify.com,DIRECT
DOMAIN-SUFFIX,spotifycdn.com,DIRECT

DOMAIN-WILDCARD,ads*-normal-lq.zijieapi.com,REJECT
DOMAIN-WILDCARD,ads*-normal-hl.zijieapi.com,REJECT

GEOIP,CN,DIRECT

FINAL,PROXY

[Host]
localhost = 127.0.0.1
