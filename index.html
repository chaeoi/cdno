<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CDNO CDN 文件目录">
  <link rel="preconnect" href="https://registry.npmmirror.com">
  <link rel="stylesheet" href="https://registry.npmmirror.com/lxgw-wenkai-screen-web/1.522.0/files/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232e2e33'/%3E%3Cpath d='M42 22a15 15 0 1 0 0 20' fill='none' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <title>CDNO 文件目录</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #2e2e33;
      --muted: #73747b;
      --line: #dedee2;
      --line-strong: #c9c9ce;
      --paper: #f7f7f8;
      --surface: #ffffff;
      --surface-soft: #f0f0f2;
      --accent: #2e2e33;
      --accent-dark: #18181b;
      --accent-soft: #ececee;
      --warning: #686970;
      --shadow: 0 12px 32px rgba(46, 46, 51, .08);
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--paper);
      font: 15px/1.55 "LXGW WenKai Screen", sans-serif;
    }

    button, input { font: inherit; }

    button { cursor: pointer; }

    .page-shell {
      width: min(1180px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 56px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 44px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--ink);
      text-decoration: none;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      color: #fff;
      background: var(--accent);
      border-radius: 9px;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 750;
      letter-spacing: 0;
    }

    .brand-context {
      margin-left: 8px;
      padding-left: 12px;
      color: var(--muted);
      border-left: 1px solid var(--line-strong);
      font-size: 13px;
    }

    .intro {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 32px;
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .stats {
      display: flex;
      align-items: flex-end;
      gap: 24px;
      padding-bottom: 3px;
    }

    .stat { min-width: 75px; }

    .stat-value {
      display: block;
      color: var(--ink);
      font-size: 26px;
      font-weight: 750;
      line-height: 1;
    }

    .stat-label {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .workspace {
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }

    .search-wrap {
      position: relative;
      flex: 1 1 360px;
      max-width: 480px;
    }

    .search-wrap svg {
      position: absolute;
      top: 50%;
      left: 13px;
      width: 17px;
      height: 17px;
      color: var(--muted);
      transform: translateY(-50%);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 42px;
      padding: 0 38px 0 40px;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--line-strong);
      border-radius: 6px;
      outline: none;
    }

    #search:focus {
      background: #fff;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(46, 46, 51, .12);
    }

    .clear-search {
      position: absolute;
      top: 50%;
      right: 9px;
      display: grid;
      width: 24px;
      height: 24px;
      padding: 0;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 4px;
      transform: translateY(-50%);
    }

    .clear-search:hover { color: var(--ink); background: var(--line); }

    .clear-search[hidden] { display: none; }

    .clear-search svg { position: static; width: 14px; height: 14px; transform: none; }

    .filters {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 7px;
    }

    .filter {
      height: 34px;
      padding: 0 12px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      font-size: 13px;
    }

    .filter:hover { color: var(--ink); border-color: var(--accent); }

    .filter.active {
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-color: var(--line-strong);
      font-weight: 700;
    }

    .table-head {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 145px 110px 196px;
      gap: 16px;
      padding: 11px 20px;
      color: var(--muted);
      background: var(--surface-soft);
      border-bottom: 1px solid var(--line);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .file-list { list-style: none; margin: 0; padding: 0; }

    .file-row {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) 145px 110px 196px;
      align-items: center;
      gap: 16px;
      min-height: 78px;
      padding: 13px 20px;
      border-bottom: 1px solid var(--line);
    }

    .file-row:last-child { border-bottom: 0; }

    .file-row:hover { background: #fafafa; }

    .file-main {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 12px;
    }

    .file-icon {
      display: grid;
      flex: 0 0 34px;
      width: 34px;
      height: 34px;
      place-items: center;
      color: var(--accent-dark);
      background: var(--accent-soft);
      border-radius: 6px;
    }

    .file-icon svg { width: 18px; height: 18px; }

    .file-copy { min-width: 0; }

    .file-name {
      display: block;
      overflow: hidden;
      color: var(--ink);
      font-weight: 680;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-path {
      display: block;
      overflow: hidden;
      margin-top: 2px;
      color: var(--muted);
      font-family: "LXGW WenKai Mono Screen", ui-monospace, monospace;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-type, .file-size { color: var(--muted); font-size: 13px; }

    .file-type { text-transform: capitalize; }

    .file-actions {
      display: flex;
      justify-content: flex-end;
      gap: 7px;
    }

    .action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      padding: 0 10px;
      color: var(--muted);
      background: #fff;
      border: 1px solid var(--line-strong);
      border-radius: 5px;
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
    }

    .action:hover { color: var(--accent-dark); border-color: var(--accent); }

    .action.primary {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .action.primary:hover { background: var(--accent-dark); border-color: var(--accent-dark); }

    .action svg { width: 14px; height: 14px; }

    .empty {
      display: none;
      padding: 54px 20px;
      color: var(--muted);
      text-align: center;
    }

    .empty.visible { display: block; }

    .empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-size: 16px; }

    .status {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 13px 20px;
      color: var(--muted);
      background: var(--surface-soft);
      border-top: 1px solid var(--line);
      font-size: 12px;
    }

    .status-message { display: inline-flex; align-items: center; gap: 7px; }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--accent);
      border-radius: 50%;
    }

    .status-dot.warning { background: var(--warning); }

    .toast {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 5;
      max-width: min(360px, calc(100% - 44px));
      padding: 11px 14px;
      color: #fff;
      background: var(--accent-dark);
      border-radius: 5px;
      box-shadow: var(--shadow);
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 800px) {
      .page-shell { width: min(100% - 28px, 680px); padding-top: 22px; }
      .topbar { margin-bottom: 34px; }
      .intro { display: block; }
      .stats { margin-top: 24px; }
      .toolbar { display: block; }
      .search-wrap { max-width: none; }
      .filters { justify-content: flex-start; margin-top: 12px; }
      .table-head { display: none; }
      .file-row { display: grid; grid-template-columns: 1fr auto; gap: 11px 16px; padding: 16px; }
      .file-type, .file-size { font-size: 12px; }
      .file-type { grid-column: 1; margin-left: 46px; margin-top: -9px; }
      .file-size { display: none; }
      .file-actions { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
      .action { width: 34px; padding: 0; }
      .action span { display: none; }
      .status { padding: 12px 16px; }
      .status time { display: none; }
    }

    @media (max-width: 440px) {
      .brand-context { display: none; }
      h1 { font-size: 30px; }
      .stats { gap: 18px; }
      .stat-value { font-size: 23px; }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="CDNO 首页">
        <span class="brand-mark">C</span>
        <span class="brand-name">CDNO<span class="brand-context">CDN 文件目录</span></span>
      </a>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <div>
        <p class="eyebrow">Public assets</p>
        <h1 id="page-title">CDN 文件目录</h1>
      </div>
      <div class="stats" aria-label="目录统计">
        <div class="stat"><span id="file-count" class="stat-value">—</span><span class="stat-label">个文件</span></div>
        <div class="stat"><span id="type-count" class="stat-value">—</span><span class="stat-label">种类型</span></div>
      </div>
    </section>

    <section class="workspace" aria-label="文件列表">
      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search" type="search" placeholder="搜索文件名" aria-label="搜索文件名" autocomplete="off" spellcheck="false">
          <button id="clear-search" class="clear-search" type="button" aria-label="清除搜索" title="清除搜索" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div id="filters" class="filters" aria-label="按文件类型筛选"></div>
      </div>

      <div class="table-head" aria-hidden="true">
        <span>文件</span><span>类型</span><span>大小</span><span></span>
      </div>
      <ul id="file-list" class="file-list"></ul>
      <div id="empty" class="empty"><strong>没有匹配的文件</strong><span>试试其他文件名或切换文件类型。</span></div>
      <div class="status">
        <span class="status-message"><span id="status-dot" class="status-dot"></span><span id="status-text">正在读取目录…</span></span>
        <time id="updated-at"></time>
      </div>
    </section>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      'use strict';

      var CDN_BASE = 'https://cdno.canghai.org';
      var TREE_URL = 'https://api.github.com/repos/chaeoi/cdno/git/trees/main?recursive=1';
      var CACHE_KEY = 'cdno-file-tree-v1';

      var state = { files: [], filter: 'all', query: '' };
      var list = document.getElementById('file-list');
      var empty = document.getElementById('empty');
      var search = document.getElementById('search');
      var clearSearch = document.getElementById('clear-search');
      var filters = document.getElementById('filters');
      var statusText = document.getElementById('status-text');
      var statusDot = document.getElementById('status-dot');
      var updatedAt = document.getElementById('updated-at');
      var toast = document.getElementById('toast');
      var toastTimer;

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, function (character) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character];
        });
      }

      function classify(path) {
        var extension = path.split('.').pop().toLowerCase();
        var names = { js: 'JavaScript', user: 'JavaScript', conf: '配置', sh: 'Shell', svg: 'SVG', html: 'HTML', css: 'CSS', json: 'JSON', md: '文档' };
        return names[extension] || (path.indexOf('/') === -1 ? '文件' : '资源');
      }

      function iconFor(type) {
        if (type === 'JavaScript') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 9 5 12l3 3M16 9l3 3-3 3M14 5l-4 14"/></svg>';
        if (type === '配置') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="1.5" fill="currentColor"/><circle cx="15" cy="12" r="1.5" fill="currentColor"/><circle cx="11" cy="17" r="1.5" fill="currentColor"/></svg>';
        if (type === 'SVG') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v16H5z"/><path d="m8 15 2.2-3 2 2 1.5-2 2.3 3"/><circle cx="9" cy="8.5" r="1"/></svg>';
        if (type === 'Shell') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 10 2 2-2 2M12 14h4"/></svg>';
        return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h9l3 3v15H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></svg>';
      }

      function formatSize(bytes) {
        if (!bytes) return '—';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(bytes < 10 * 1024 ? 1 : 0) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }

      function fileName(path) { return path.split('/').pop(); }

      function fileUrl(path) { return CDN_BASE + '/' + path.split('/').map(encodeURIComponent).join('/'); }

      function showToast(message) {
        clearTimeout(toastTimer);
        toast.textContent = message;
        toast.classList.add('show');
        toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 2400);
      }

      function copyText(value) {
        if (navigator.clipboard && window.isSecureContext) {
          return navigator.clipboard.writeText(value);
        }
        var helper = document.createElement('textarea');
        helper.value = value;
        helper.style.position = 'fixed';
        helper.style.opacity = '0';
        document.body.appendChild(helper);
        helper.select();
        document.execCommand('copy');
        helper.remove();
        return Promise.resolve();
      }

      function renderFilters() {
        var counts = { all: state.files.length };
        state.files.forEach(function (file) { counts[file.type] = (counts[file.type] || 0) + 1; });
        var types = Object.keys(counts).filter(function (type) { return type !== 'all'; });
        var labels = { all: '全部' };
        filters.innerHTML = ['all'].concat(types).map(function (type) {
          var label = labels[type] || type;
          return '<button class="filter' + (state.filter === type ? ' active' : '') + '" type="button" data-filter="' + escapeHtml(type) + '">' + escapeHtml(label) + ' <span>(' + counts[type] + ')</span></button>';
        }).join('');
        filters.querySelectorAll('[data-filter]').forEach(function (button) {
          button.addEventListener('click', function () {
            state.filter = button.dataset.filter;
            renderFilters();
            renderList();
          });
        });
      }

      function renderList() {
        var query = state.query.trim().toLowerCase();
        var visible = state.files.filter(function (file) {
          var matchesFilter = state.filter === 'all' || file.type === state.filter;
          var matchesQuery = !query || fileName(file.path).toLowerCase().indexOf(query) !== -1;
          return matchesFilter && matchesQuery;
        });
        list.innerHTML = visible.map(function (file) {
          var url = fileUrl(file.path);
          return '<li class="file-row">' +
            '<div class="file-main"><span class="file-icon">' + iconFor(file.type) + '</span><span class="file-copy"><span class="file-name" title="' + escapeHtml(fileName(file.path)) + '">' + escapeHtml(fileName(file.path)) + '</span><span class="file-path" title="' + escapeHtml(file.path) + '">' + escapeHtml(file.path) + '</span></span></div>' +
            '<span class="file-type">' + escapeHtml(file.type) + '</span>' +
            '<span class="file-size">' + formatSize(file.size) + '</span>' +
            '<span class="file-actions"><button class="action" type="button" data-copy="' + escapeHtml(url) + '" aria-label="复制 ' + escapeHtml(fileName(file.path)) + ' 的 CDN 地址" title="复制 CDN 地址"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M15 9V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h3"/></svg><span>复制</span></button><a class="action primary" href="' + escapeHtml(url) + '" target="_blank" rel="noreferrer" aria-label="打开 ' + escapeHtml(fileName(file.path)) + '" title="打开文件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 5h5v5M19 5l-8 8"/><path d="M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg><span>打开</span></a></span>' +
            '</li>';
        }).join('');
        empty.classList.toggle('visible', visible.length === 0);
        list.querySelectorAll('[data-copy]').forEach(function (button) {
          button.addEventListener('click', function () {
            copyText(button.dataset.copy).then(function () { showToast('CDN 地址已复制'); }).catch(function () { showToast('复制失败，请手动复制地址'); });
          });
        });
      }

      function setFiles(files, fromApi) {
        state.files = files.filter(function (file) {
          return file.path && file.path !== 'index.html' && file.path.split('/').every(function (part) { return part.charAt(0) !== '.'; });
        }).map(function (file) {
          return { path: file.path, size: Number(file.size) || 0, type: classify(file.path) };
        }).sort(function (a, b) { return a.path.localeCompare(b.path, 'en'); });
        document.getElementById('file-count').textContent = state.files.length;
        document.getElementById('type-count').textContent = new Set(state.files.map(function (file) { return file.type; })).size;
        renderFilters();
        renderList();
        statusText.textContent = fromApi ? '目录已更新' : '显示缓存目录';
        statusDot.classList.toggle('warning', !fromApi);
        updatedAt.textContent = '更新于 ' + new Intl.DateTimeFormat('zh-CN', { dateStyle: 'medium' }).format(new Date());
      }

      function readCache() {
        try {
          var cache = JSON.parse(localStorage.getItem(CACHE_KEY));
          return cache && Array.isArray(cache.files) && cache.files.length ? cache : null;
        } catch (error) {
          return null;
        }
      }

      function writeCache(files) {
        try {
          localStorage.setItem(CACHE_KEY, JSON.stringify({ files: files, savedAt: Date.now() }));
        } catch (error) {
          // The live directory still works when browser storage is unavailable.
        }
      }

      function showLoadError() {
        state.files = [];
        document.getElementById('file-count').textContent = '—';
        document.getElementById('type-count').textContent = '—';
        filters.innerHTML = '';
        list.innerHTML = '';
        empty.querySelector('strong').textContent = '暂时无法读取文件目录';
        empty.querySelector('span').textContent = '请稍后刷新页面重试。';
        empty.classList.add('visible');
        statusText.textContent = '目录同步失败';
        statusDot.classList.add('warning');
        updatedAt.textContent = '';
      }

      function loadFiles() {
        var cached = readCache();
        if (cached) {
          setFiles(cached.files, false);
          statusText.textContent = '正在同步最新目录…';
        }
        var controller = typeof AbortController === 'function' ? new AbortController() : null;
        var timeout = controller ? setTimeout(function () { controller.abort(); }, 7000) : null;
        var options = controller ? { signal: controller.signal } : {};
        fetch(TREE_URL, options).then(function (response) {
          if (!response.ok) throw new Error('目录接口返回 ' + response.status);
          return response.json();
        }).then(function (payload) {
          if (timeout) clearTimeout(timeout);
          var files = (payload.tree || []).filter(function (item) { return item.type === 'blob'; });
          if (!files.length) throw new Error('目录为空');
          setFiles(files, true);
          writeCache(files);
        }).catch(function () {
          if (timeout) clearTimeout(timeout);
          if (cached) {
            statusText.textContent = '显示上次自动同步的目录';
            statusDot.classList.add('warning');
          } else {
            showLoadError();
          }
        });
      }

      search.addEventListener('input', function () {
        state.query = search.value;
        clearSearch.hidden = !state.query;
        renderList();
      });
      clearSearch.addEventListener('click', function () {
        search.value = '';
        state.query = '';
        clearSearch.hidden = true;
        search.focus();
        renderList();
      });

      loadFiles();
    }());
  </script>
</body>
</html>
